# falcondatabase — production stack: PostgreSQL + the web app.
# Configuration comes from .env (create it with ./install.sh or from .env.example).
# HTTPS: ./install.sh copies docker-compose.https.yml to docker-compose.override.yml,
# which Docker Compose loads automatically.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-falcondatabase}
      POSTGRES_USER: ${POSTGRES_USER:-falcon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build: .
    image: falcondatabase:latest
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${FALCONDB_BIND:-0.0.0.0}:${FALCONDB_PORT:-8000}:8000"
    volumes:
      - storage:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Uptime monitoring: checks the monitors' websites and sends the alerts.
  uptime:
    build: .
    image: falcondatabase:latest
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      web:
        condition: service_healthy
    command: ["python", "manage.py", "uptime_worker"]

volumes:
  pgdata:
  storage:
