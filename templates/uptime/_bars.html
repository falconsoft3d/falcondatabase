{% load i18n %}{# Expects: bars (uptime.stats.daily_bars) #}
<div class="uptime-bars" role="img" aria-label="{% translate 'Uptime per day' %}">
  {% for day in bars %}<span class="{{ day.level }}" title="{{ day.date|date:'d M Y' }} · {% if day.pct is None %}{% translate 'No data' %}{% else %}{{ day.pct }}%{% if day.failed %} · {% blocktranslate count counter=day.failed %}{{ counter }} failed check{% plural %}{{ counter }} failed checks{% endblocktranslate %}{% endif %}{% endif %}"></span>{% endfor %}
</div>
